<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad PR Causation - Test Data App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #222;
        }

        .app-section {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            margin: 12px 0;
            border-radius: 5px;
        }

        h1 {
            color: #007bff;
        }

        h3 {
            margin-top: 0;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        input {
            padding: 6px 10px;
            margin: 4px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
            display: block;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .banner {
            background-color: #e7f1ff;
            border-left: 4px solid #007bff;
            padding: 10px 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Bad PR Causation - Test Data App</h1>
    <p>Minimal app surface used by <code>specs/bad-pr-causation.spec.js</code> to generate Bad-PR-Causation RCA training signal.</p>

    <!-- Welcome banner -->
    <div class="app-section">
        <div id="welcome-banner" class="banner">Hi!</div>
    </div>

    <!-- Login -->
    <div class="app-section" id="login-section">
        <h3>Login</h3>
        <input id="username-input" type="text" placeholder="Username">
        <input id="password-input" type="password" placeholder="Password">
        <button id="signin-btn">Sign In</button>
    </div>

    <!-- Profile -->
    <div class="app-section" id="profile-section">
        <h3>Profile</h3>
        <div id="profile-name">Jane Doe</div>
    </div>

    <!-- Cart -->
    <div class="app-section" id="cart-section">
        <h3>Cart</h3>
        <div id="cart-count">0 items</div>
    </div>

    <!-- Submit Form -->
    <div class="app-section" id="submit-form-section">
        <h3>Order</h3>
    </div>

    <!-- Logout -->
    <div class="app-section" id="logout-section">
        <a id="log-out" href="#">Logout</a>
    </div>
</body>

</html>
